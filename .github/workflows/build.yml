name: build

# Every push: tests + Windows USB creator + ISO as downloadable build artifacts.
# Pushing a tag like v0.1.0: also publishes a GitHub Release containing
#   bitclone-usb.exe          (the Windows USB creator)
#   bitclone-amd64.iso        (the boot image; the creator downloads this)
#   bitclone-amd64.iso.sha256
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Real-filesystem round trip (mkfs + fsck)
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g dosfstools e2fsprogs
          go build -o bitclone ./cmd/bitclone
          sudo ./scripts/fs-integration-test.sh ./bitclone

  usb-creator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go test ./cmd/bitclone-usb/
      - name: Build bitclone-usb.exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.releaseRepo=${GITHUB_REPOSITORY} -X main.version=${VERSION}" \
            -o dist/bitclone-usb.exe ./cmd/bitclone-usb
      - uses: actions/upload-artifact@v4
        with:
          name: bitclone-usb
          path: dist/bitclone-usb.exe

  iso:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO in Debian container
        run: sh scripts/build-iso-docker.sh
      - name: Stable file name + checksum
        run: |
          sudo chown -R "$USER" dist
          mv dist/bitclone-*-amd64.iso dist/bitclone-amd64.iso
          (cd dist && sha256sum bitclone-amd64.iso > bitclone-amd64.iso.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: bitclone-iso
          path: dist/bitclone-amd64.iso*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [iso, usb-creator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "bitclone $GITHUB_REF_NAME" \
            --notes "Download **bitclone-usb.exe**, run it, and it will download the boot image and write your USB stick."
