name: build

# Every push: tests + Windows USB creator + ISO as downloadable build artifacts.
# Pushing a tag like v0.1.0: also publishes a GitHub Release containing
#   imagen-usb.exe          (the Windows USB creator)
#   imagen-amd64.iso        (the boot image; the creator downloads this)
#   imagen-amd64.iso.sha256
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Real-filesystem round trip (mkfs + fsck)
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g dosfstools e2fsprogs
          go build -o imagen ./cmd/imagen
          sudo ./scripts/fs-integration-test.sh ./imagen

  usb-creator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - run: go test ./cmd/imagen-usb/
      - name: Build imagen-usb.exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.releaseRepo=${GITHUB_REPOSITORY} -X main.version=${VERSION}" \
            -o dist/imagen-usb.exe ./cmd/imagen-usb
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-usb
          path: dist/imagen-usb.exe

  iso:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO in Debian container
        run: sh scripts/build-iso-docker.sh
      - name: Stable file name + checksum
        run: |
          sudo chown -R "$USER" dist
          mv dist/imagen-*-amd64.iso dist/imagen-amd64.iso
          (cd dist && sha256sum imagen-amd64.iso > imagen-amd64.iso.sha256)
      - name: Boot test (QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso socat netpbm
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          mkdir -p boot-test
          # A normal screen, then a high-resolution laptop panel (the
          # interface must be scaled up there, not drawn tiny).
          for r in 1280x800 2560x1600; do
            RES=$r sh scripts/boot-test.sh dist/imagen-amd64.iso || failed=1
            [ -f dist/boot-test/screen.ppm ] && pnmtopng dist/boot-test/screen.ppm > "boot-test/screen-$r.png"
            cp dist/boot-test/serial.log "boot-test/serial-$r.log" 2>/dev/null; cp dist/boot-test/grub.cfg boot-test/ 2>/dev/null
            chmod -R u+w dist/boot-test; rm -rf dist/boot-test
          done
          [ -z "$failed" ]
      - name: Boot test cleanup
        if: always()
        run: |
          if [ -d dist/boot-test ]; then chmod -R u+w dist/boot-test; rm -rf dist/boot-test; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: boot-test/
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-iso
          path: dist/imagen-amd64.iso*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [iso, usb-creator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: imagen-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ImaGen $GITHUB_REF_NAME" \
            --notes "Download **imagen-usb.exe**, run it, and it will download the boot image and write your USB stick."
