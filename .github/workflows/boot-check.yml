name: boot-check

# Manually boots an already published ISO in QEMU at a chosen screen
# resolution and saves a screenshot, without rebuilding anything.
on:
  push:
    paths: [.github/workflows/boot-check.yml, scripts/boot-test.sh]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose imagen-amd64.iso to boot
        default: v0.3.2
      resolutions:
        description: Space-separated screen resolutions
        default: 1280x800
      poweroff:
        description: Also click Shut down (at 1280x800) and record the shutdown
        type: boolean
        default: true

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag || 'v0.3.2' }}" --repo "$GITHUB_REPOSITORY" --pattern imagen-amd64.iso --dir dist
      - name: Boot at each resolution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso socat netpbm
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          mkdir -p out
          for r in ${{ inputs.resolutions || '1280x800' }}; do
            echo "::group::$r"
            RES=$r sh scripts/boot-test.sh dist/imagen-amd64.iso || echo "boot at $r failed"
            [ -f dist/boot-test/screen.ppm ] && pnmtopng dist/boot-test/screen.ppm > "out/screen-$r.png"
            cp dist/boot-test/serial.log "out/serial-$r.log" || true
            chmod -R u+w dist/boot-test; rm -rf dist/boot-test
            echo "::endgroup::"
          done
          if [ "${{ (github.event_name == 'push' || inputs.poweroff) && 'yes' || 'no' }}" = yes ]; then
            echo "::group::shut down"
            RES=1280x800 POWEROFF=1 sh scripts/boot-test.sh dist/imagen-amd64.iso || echo "shutdown test failed"
            for p in dist/boot-test/*.ppm; do pnmtopng "$p" > "out/$(basename "$p" .ppm).png"; done
            cp dist/boot-test/serial.log out/serial-shutdown.log || true
            echo "::endgroup::"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-check
          path: out/
